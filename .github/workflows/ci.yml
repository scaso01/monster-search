name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # A plain install, not an editable one, so a missing runtime dependency
      # shows up here rather than in someone's fresh clone.
      # uv.lock holds the exact versions CI tests, solved as one set so updates never conflict.
      # --locked fails the run if pyproject.toml changed without re-running `uv lock`.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.12.22
          uv export --locked --no-hashes --no-emit-project --all-extras -o "$RUNNER_TEMP/constraints.txt"
          pip install -c "$RUNNER_TEMP/constraints.txt" ".[dev]"

      # Integration tests need live self-hosted containers, so they stay out.
      - name: Test
        run: pytest tests/ -q -m "not integration"

      # tests/ is linted too. Dead imports and assigned-but-unused names in a
      # test are worth catching: the second kind is often a result that was
      # computed and then never asserted on.
      - name: Lint
        run: pyflakes src/monster_search/ tests/

  # The one check branch protection requires, so matrix changes never strand a merge.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
