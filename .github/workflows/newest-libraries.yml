name: Newest libraries

# CI pins versions (uv.lock). This weekly run installs the newest allowed
# versions instead, so a release that breaks a fresh install shows up within a week.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: pytest tests/ -q -m "not integration"
      - run: pyflakes src/monster_search/ tests/
