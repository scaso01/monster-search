[build-system]
# 77.0 is the floor for PEP 639, which is what lets `license` below be a plain
# SPDX string with a separate `license-files`. Older setuptools only understands
# the deprecated table form.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monster-search"
version = "0.10.0"
description = "Unified search hub: 34 engines across web, academic, code, security, packages, WHOIS, news, video, AI, community, archive and shopping, behind one CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Name only. The email is deliberately absent: package metadata is permanent and
# gets scraped, and LICENSE already carries the same name, so this adds nothing
# a reader needs. Contact goes through the Issues URL below.
authors = [{ name = "Sean Caso" }]
keywords = [
    "search",
    "metasearch",
    "search-engine",
    "aggregator",
    "cli",
    "searxng",
    "self-hosted",
    "reciprocal-rank-fusion",
]
classifiers = [
    # Checked against PyPI's live trove list. No "License :: OSI Approved ::"
    # entry on purpose: setuptools rejects a license classifier alongside the
    # SPDX expression above.
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.0",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=0.6.0",
    # _dedup imports this at module scope and all_engines imports _dedup, so a
    # missing datasketch is an ImportError on the main search path, not an
    # optional-feature degradation.
    "datasketch>=1.6.0",
]

[project.optional-dependencies]
perplexity = ["curl_cffi>=0.7.0"]
all-engines = ["curl_cffi>=0.7.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "pyflakes>=3.2.0",
    # The Perplexity engine is optional, but two health tests assert the probe
    # reports UP once auth is configured, and it only does that when curl_cffi
    # imports. Without this the suite passes locally and fails anywhere clean.
    "curl_cffi>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/scaso01/monster-search"
Repository = "https://github.com/scaso01/monster-search"
Issues = "https://github.com/scaso01/monster-search/issues"
Changelog = "https://github.com/scaso01/monster-search/releases"

[project.scripts]
monster-search = "monster_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Without this the marker is not installed, so the type hints this package
# ships are invisible to a type checker in any downstream project.
monster_search = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
markers = [
    "integration: requires the self-hosted containers to be running (deselect with '-m \"not integration\"')",
    "slow: an AI engine or full sweep, roughly a minute or more per test",
]
